name: Synthetic regression tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      WOO_URL: https://example.test
      WOO_CONSUMER_KEY: ""
      WOO_CONSUMER_SECRET: ""
      SYNC_ENABLED: "false"
      DRY_RUN: "true"
      ZERO_GHOST_STOCK: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m compileall -q main.py src config dashboard scripts
      - run: python -m pytest tests
